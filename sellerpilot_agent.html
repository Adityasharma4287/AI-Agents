<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SellerPilot AI Agent</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#111113;--s1:#18181b;--s2:#1f1f24;--s3:#27272d;--s4:#2e2e36;
  --b1:rgba(255,255,255,0.06);--b2:rgba(255,255,255,0.1);--b3:rgba(255,255,255,0.16);
  --t1:#f0f0f4;--t2:#a0a0b0;--t3:#606070;--t4:#383848;
  --p:#7c6dfa;--p2:#9d91fb;--p3:#c4bdfc;
  --g:#22c97a;--r:#f05050;--a:#f0a030;--b:#4ab0f5;--tl:#00d8b8;
  --rad:10px;--rad2:14px;
}
html,body{height:100%;font-family:'Inter',sans-serif;background:var(--bg);color:var(--t1);font-size:14px;line-height:1.5}

/* ── SHELL ── */
.shell{display:flex;height:100vh;overflow:hidden}

/* ── SIDEBAR ── */
.sb{
  width:256px;min-width:256px;background:var(--s1);
  border-right:1px solid var(--b1);
  display:flex;flex-direction:column;overflow:hidden;
  transition:width .2s;
}
.sb-top{
  padding:14px 12px 10px;border-bottom:1px solid var(--b1);
  display:flex;align-items:center;gap:10px;
}
.logo{
  width:36px;height:36px;border-radius:10px;flex-shrink:0;
  background:linear-gradient(135deg,var(--p) 0%,#4a7af0 100%);
  display:flex;align-items:center;justify-content:center;font-size:18px;
  box-shadow:0 2px 12px rgba(124,109,250,0.35);
}
.logo-text{flex:1}
.logo-name{font-size:14px;font-weight:600;letter-spacing:-.3px;color:var(--t1)}
.logo-sub{font-size:10px;color:var(--t3);font-family:'JetBrains Mono',monospace;margin-top:1px}

.sb-body{flex:1;overflow-y:auto;padding:8px;scrollbar-width:none}
.sb-body::-webkit-scrollbar{display:none}
.sb-label{font-size:10px;font-weight:600;color:var(--t4);text-transform:uppercase;letter-spacing:1.2px;padding:10px 8px 4px}
.sb-row{
  display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--rad);
  cursor:pointer;color:var(--t2);font-size:13px;font-weight:500;
  transition:all .15s;border:none;background:none;width:100%;text-align:left;font-family:inherit;
  position:relative;
}
.sb-row:hover{background:var(--s2);color:var(--t1)}
.sb-row.act{background:var(--s3);color:var(--t1)}
.sb-row .em{font-size:15px;width:20px;text-align:center;flex-shrink:0}
.sb-row .lbl{flex:1}
.sb-badge{
  font-size:10px;font-weight:700;font-family:'JetBrains Mono',monospace;
  padding:2px 7px;border-radius:20px;min-width:22px;text-align:center;
}
.bd-r{background:rgba(240,80,80,.14);color:var(--r)}
.bd-a{background:rgba(240,160,48,.12);color:var(--a)}
.bd-g{background:rgba(34,201,122,.12);color:var(--g)}
.bd-p{background:rgba(124,109,250,.14);color:var(--p2)}

.sb-foot{
  padding:12px;border-top:1px solid var(--b1);
  display:flex;flex-direction:column;gap:8px;
}
.sb-stat{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--t3)}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dot.live{background:var(--g);animation:beat 2s infinite}
.dot.off{background:var(--r)}
@keyframes beat{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.85)}}

/* ── MAIN ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* ── TOPBAR ── */
.topbar{
  height:52px;padding:0 20px;border-bottom:1px solid var(--b1);
  display:flex;align-items:center;gap:12px;flex-shrink:0;background:var(--bg);
}
.tb-name{font-size:13px;font-weight:600}
.tb-pill{
  font-size:10px;font-family:'JetBrains Mono',monospace;font-weight:500;
  padding:3px 9px;border-radius:5px;border:1px solid;
}
.pill-model{background:rgba(124,109,250,.08);color:var(--p3);border-color:rgba(124,109,250,.22)}
.pill-live{background:rgba(34,201,122,.07);color:var(--g);border-color:rgba(34,201,122,.22)}
.tb-sp{flex:1}
.tb-btn{
  font-size:12px;color:var(--t3);background:none;border:1px solid var(--b2);
  border-radius:7px;padding:5px 12px;cursor:pointer;font-family:inherit;transition:all .15s;
}
.tb-btn:hover{background:var(--s2);color:var(--t2)}

/* ── CHAT AREA ── */
.chat{
  flex:1;overflow-y:auto;padding:28px 0 12px;
  scrollbar-width:thin;scrollbar-color:var(--s3) transparent;
}
.chat::-webkit-scrollbar{width:4px}
.chat::-webkit-scrollbar-thumb{background:var(--s3);border-radius:2px}

.divider{
  text-align:center;padding:8px 0;font-size:11px;color:var(--t4);
  font-family:'JetBrains Mono',monospace;
}

/* ── MESSAGE GROUP ── */
.mg{padding:4px 24px 8px;display:flex;flex-direction:column}
.mg+.mg{margin-top:4px}

.who{
  font-size:11px;color:var(--t4);font-family:'JetBrains Mono',monospace;
  display:flex;align-items:center;gap:6px;margin-bottom:5px;
}
.who-em{font-size:13px}

/* user bubble */
.ubub{
  align-self:flex-start;max-width:75%;
  background:var(--s2);border:1px solid var(--b2);
  border-radius:4px var(--rad2) var(--rad2) var(--rad2);
  padding:10px 14px;font-size:13.5px;line-height:1.7;
  white-space:pre-wrap;word-break:break-word;color:var(--t1);
}

/* agent answer */
.atxt{
  max-width:740px;font-size:13.5px;line-height:1.8;color:var(--t1);
  white-space:pre-wrap;word-break:break-word;
}
.atxt b,.atxt strong{color:#fff;font-weight:600}

/* ── THINKING ── */
.think{
  max-width:580px;margin:4px 0 6px;
  background:rgba(124,109,250,.05);border:1px solid rgba(124,109,250,.16);
  border-radius:var(--rad2);padding:10px 14px;
  font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#9080e8;line-height:1.8;
}
.think-hd{
  font-size:10px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;opacity:.55;
  margin-bottom:5px;display:flex;align-items:center;gap:5px;
}
.think-hd::before{content:'';width:5px;height:5px;background:var(--p2);border-radius:50%;animation:beat 1s infinite}

/* ── TOOL BLOCK ── */
.tbk{
  max-width:560px;margin:5px 0 6px;
  background:var(--s2);border:1px solid var(--b2);border-radius:var(--rad2);overflow:hidden;
}
.tbk-hd{
  padding:8px 13px;background:var(--s3);border-bottom:1px solid var(--b1);
  display:flex;align-items:center;gap:8px;
  font-family:'JetBrains Mono',monospace;font-size:11.5px;
}
.tbk-fn{color:var(--tl);font-weight:500}
.tbk-args{color:var(--t3);font-size:10.5px}
.tbk-st{margin-left:auto;font-size:10px;font-family:'JetBrains Mono',monospace}
.tbk-st.run{color:var(--a);animation:beat .8s infinite}
.tbk-st.ok{color:var(--g)}
.tbk-body{
  padding:10px 13px;font-family:'JetBrains Mono',monospace;font-size:11.5px;
  color:var(--t2);line-height:1.8;max-height:240px;overflow-y:auto;
}
.tl{display:block}
.tl.g{color:var(--g)}.tl.r{color:var(--r)}.tl.a{color:var(--a)}
.tl.b{color:var(--b)}.tl.p{color:var(--p2)}.tl.t{color:var(--tl)}.tl.d{color:var(--t4)}

/* ── BLINK CURSOR ── */
.cur{display:inline-block;width:2px;height:14px;background:var(--t2);vertical-align:middle;margin-left:1px;animation:blink 1s step-end infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* ── MSG ACTIONS ── */
.macts{display:flex;gap:4px;margin-top:6px;opacity:0;transition:opacity .2s}
.mg:hover .macts{opacity:1}
.mact{
  font-size:11px;color:var(--t3);background:none;border:1px solid var(--b1);
  border-radius:5px;padding:3px 8px;cursor:pointer;font-family:inherit;transition:all .15s;
}
.mact:hover{background:var(--s2);color:var(--t2)}

/* ── INPUT ── */
.inp-area{padding:12px 20px;border-top:1px solid var(--b1);flex-shrink:0;background:var(--bg)}
.inp-wrap{
  background:var(--s1);border:1px solid var(--b2);border-radius:var(--rad2);
  max-width:820px;margin:0 auto;transition:border-color .2s;
}
.inp-wrap:focus-within{border-color:rgba(124,109,250,.4)}

.qrow{display:flex;gap:5px;padding:9px 12px 0;overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap}
.qrow::-webkit-scrollbar{display:none}
.qchip{
  font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--t3);
  padding:4px 11px;border-radius:6px;border:1px solid var(--b1);
  background:none;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .15s;
}
.qchip:hover{background:var(--s2);color:var(--t2);border-color:var(--b2)}

.ta-row{display:flex;align-items:flex-end;padding:8px 10px}
textarea{
  flex:1;background:none;border:none;outline:none;resize:none;
  color:var(--t1);font-family:'Inter',sans-serif;font-size:13.5px;line-height:1.65;
  min-height:24px;max-height:180px;
}
textarea::placeholder{color:var(--t4)}
.snd{
  width:34px;height:34px;border-radius:9px;border:none;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:16px;
  background:var(--s3);color:var(--t3);transition:all .15s;
}
.snd.on{background:linear-gradient(135deg,var(--p),#4a7af0);color:#fff;box-shadow:0 2px 14px rgba(124,109,250,.4)}
.snd.on:hover{transform:translateY(-1px);box-shadow:0 4px 18px rgba(124,109,250,.5)}

.inp-foot{padding:4px 12px 9px;font-size:10px;color:var(--t4);font-family:'JetBrains Mono',monospace;display:flex;gap:14px}
.inp-foot span{cursor:default}

/* ── RESPONSIVE ── */
@media(max-width:640px){.sb{display:none}.mg{padding:4px 14px 6px}}
</style>
</head>
<body>
<div class="shell">

  <!-- ═══ SIDEBAR ═══ -->
  <aside class="sb">
    <div class="sb-top">
      <div class="logo">🤖</div>
      <div class="logo-text">
        <div class="logo-name">SellerPilot AI</div>
        <div class="logo-sub">claude-sonnet-4-6 · 5 tools</div>
      </div>
    </div>

    <div class="sb-body">
      <div class="sb-label">Quick actions</div>
      <button class="sb-row" onclick="q('Check my inventory — show all products and flag low stock')">
        <span class="em">📦</span><span class="lbl">Inventory Check</span>
        <span class="sb-badge bd-r" id="b-inv">2</span>
      </button>
      <button class="sb-row" onclick="q('Analyze all ad campaigns. Pause anything with ACOS above 40%')">
        <span class="em">📢</span><span class="lbl">Optimize Ads</span>
        <span class="sb-badge bd-r" id="b-ads">2</span>
      </button>
      <button class="sb-row" onclick="q('Find negative reviews and write a professional reply for each one')">
        <span class="em">⭐</span><span class="lbl">Handle Reviews</span>
        <span class="sb-badge bd-a" id="b-rev">3</span>
      </button>
      <button class="sb-row" onclick="q('Check all listings for suppressed status and buy box issues')">
        <span class="em">🔍</span><span class="lbl">Listing Health</span>
        <span class="sb-badge bd-r" id="b-lst">1</span>
      </button>
      <button class="sb-row" onclick="q('Give me a complete store health report for today')">
        <span class="em">📊</span><span class="lbl">Daily Report</span>
        <span class="sb-badge bd-p">daily</span>
      </button>
      <button class="sb-row" onclick="q('What is the most urgent issue I need to fix right now?')">
        <span class="em">🚨</span><span class="lbl">Most Urgent</span>
      </button>

      <div class="sb-label" style="margin-top:6px">Conversations</div>
      <button class="sb-row act"><span class="em">💬</span><span class="lbl">Current Session</span></button>

      <div class="sb-label" style="margin-top:6px">Recent</div>
      <button class="sb-row" onclick="q('How much money did I lose to bad ad campaigns this month?')">
        <span class="em">💸</span><span class="lbl" style="font-size:12px">Monthly ad waste</span>
      </button>
      <button class="sb-row" onclick="q('Which product has the worst reviews?')">
        <span class="em">⭐</span><span class="lbl" style="font-size:12px">Worst reviewed product</span>
      </button>
    </div>

    <div class="sb-foot">
      <div class="sb-stat">
        <div class="dot live" id="status-dot"></div>
        <span id="status-txt">Agent active · ready</span>
      </div>
      <div class="sb-stat" style="font-family:'JetBrains Mono',monospace;font-size:10px">
        <span id="key-st" style="color:var(--t4)">API: checking...</span>
      </div>
    </div>
  </aside>

  <!-- ═══ MAIN ═══ -->
  <div class="main">

    <!-- topbar -->
    <div class="topbar">
      <span style="font-size:16px">🤖</span>
      <span class="tb-name">SellerPilot Agent</span>
      <div class="tb-pill pill-model">claude-sonnet-4-6</div>
      <div class="tb-sp"></div>
      <div class="tb-pill pill-live" id="backend-pill">● connecting...</div>
      <button class="tb-btn" onclick="clearAll()">New chat</button>
    </div>

    <!-- messages -->
    <div class="chat" id="chat">
      <div class="divider">SellerPilot AI · Amazon India Store · <span id="today-date"></span></div>
      <div class="mg" id="welcome-mg">
        <div class="who"><span class="who-em">🤖</span><span style="color:var(--t2)">SellerPilot Agent</span></div>
        <div class="atxt" id="welcome-txt"></div>
      </div>
    </div>

    <!-- input -->
    <div class="inp-area">
      <div class="inp-wrap">
        <div class="qrow">
          <button class="qchip" onclick="q('inventory check')">📦 stock</button>
          <button class="qchip" onclick="q('pause high ACOS campaigns')">📢 ads</button>
          <button class="qchip" onclick="q('negative reviews reply karo')">⭐ reviews</button>
          <button class="qchip" onclick="q('listing issues check karo')">❌ listings</button>
          <button class="qchip" onclick="q('full store report')">📊 report</button>
          <button class="qchip" onclick="q('what is most urgent today?')">🚨 urgent</button>
          <button class="qchip" onclick="q('how much total revenue today?')">💰 revenue</button>
        </div>
        <div class="ta-row">
          <textarea id="inp" rows="1" placeholder="Ask anything about your Amazon store..."
            onkeydown="onKey(event)" oninput="onInp(this)"></textarea>
          <button class="snd" id="snd" onclick="send()">↑</button>
        </div>
        <div class="inp-foot">
          <span>↵ send · ⇧↵ newline</span>
          <span id="session-id" style="margin-left:auto"></span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════
//  CONFIG
// ═══════════════════════════════════════════════════════
const BACKEND = 'http://localhost:8000';
const SID = 'sp_' + Math.random().toString(36).slice(2,9);
let BUSY = false;
const chatEl = document.getElementById('chat');

document.getElementById('today-date').textContent = new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
document.getElementById('session-id').textContent = 'sid: ' + SID;

// ═══════════════════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════════════════
(async()=>{
  // Animate welcome
  const wt = document.getElementById('welcome-txt');
  const msg = `Hello! I'm your SellerPilot AI Agent.\n\nI work exactly like Claude — I think, decide which tool to use, run it, and give you a clear answer.\n\nWhat I can do:\n→ Check inventory & alert for low stock\n→ Analyze and pause wasteful ad campaigns\n→ Find negative reviews & write professional replies\n→ Detect suppressed listings & suggest fixes\n→ Generate a full daily health report\n\nYou can talk to me naturally — in Hindi, English, or Hinglish. Try typing something!`;
  await typeInto(wt, msg, 8);

  // Check backend
  try{
    const r = await fetch(BACKEND+'/health',{signal:AbortSignal.timeout(2500)});
    if(r.ok){
      document.getElementById('backend-pill').textContent='● backend live';
      document.getElementById('backend-pill').style.background='rgba(34,201,122,.08)';
      document.getElementById('key-st').textContent='API: connected';
      document.getElementById('key-st').style.color='var(--g)';
    }
  }catch{
    document.getElementById('backend-pill').textContent='● mock mode';
    document.getElementById('backend-pill').style.color='var(--a)';
    document.getElementById('backend-pill').style.borderColor='rgba(240,160,48,.3)';
    document.getElementById('key-st').textContent='API: offline → mock mode';
    document.getElementById('key-st').style.color='var(--a)';
  }
})();

// ═══════════════════════════════════════════════════════
//  INPUT
// ═══════════════════════════════════════════════════════
function onInp(el){
  el.style.height='auto';
  el.style.height=Math.min(el.scrollHeight,180)+'px';
  document.getElementById('snd').classList.toggle('on', el.value.trim().length>0);
}
function onKey(e){ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();} }
function q(text){ const el=document.getElementById('inp'); el.value=text; onInp(el); el.focus(); }
function clearAll(){
  fetch(BACKEND+'/chat/clear',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:SID})}).catch(()=>{});
  chatEl.innerHTML=`<div class="divider">New chat · ${new Date().toLocaleTimeString()}</div>`;
}

// ═══════════════════════════════════════════════════════
//  SEND
// ═══════════════════════════════════════════════════════
async function send(){
  const el=document.getElementById('inp');
  const txt=el.value.trim();
  if(!txt||BUSY) return;
  el.value=''; onInp(el);
  BUSY=true;
  setStatus('thinking...', true);
  addUser(txt);
  await runAgent(txt);
  BUSY=false;
  setStatus('ready', false);
}

function setStatus(msg, busy){
  document.getElementById('status-txt').textContent = 'Agent ' + (busy ? msg : 'active · '+msg);
  document.getElementById('status-dot').className = 'dot ' + (busy ? 'off' : 'live');
}

// ═══════════════════════════════════════════════════════
//  ADD USER MESSAGE
// ═══════════════════════════════════════════════════════
function addUser(text){
  const g=mk('div','mg');
  g.innerHTML=`
    <div class="who" style="justify-content:flex-end">
      <span style="color:var(--t2)">You</span><span class="who-em">👤</span>
    </div>
    <div class="ubub">${esc(text)}</div>`;
  chatEl.appendChild(g); bot();
}

// ═══════════════════════════════════════════════════════
//  RUN AGENT
// ═══════════════════════════════════════════════════════
async function runAgent(query){
  const grp = makeAgentGroup();

  try{
    const resp = await fetch(BACKEND+'/chat/stream',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:query, session_id:SID}),
    });
    if(!resp.ok) throw new Error();

    const reader=resp.body.getReader();
    const dec=new TextDecoder();
    let buf='';
    let ansEl=null;
    const toolEls={};

    while(true){
      const {done,value}=await reader.read();
      if(done) break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n'); buf=lines.pop();

      for(const ln of lines){
        if(!ln.startsWith('data: ')) continue;
        const raw=ln.slice(6).trim();
        if(raw==='[DONE]') break;
        let ev; try{ev=JSON.parse(raw);}catch{continue;}

        if(ev.type==='thinking'){
          const tb=addThink(grp,''); await typeInto(tb.querySelector('.think-body'),ev.text,14);
        } else if(ev.type==='tool_start'){
          const tb=addTool(grp,ev.tool_name,ev.tool_input); toolEls[ev.tool_name]=tb;
        } else if(ev.type==='tool_result'){
          const tb=toolEls[ev.tool_name];
          if(tb){fillToolResult(tb,ev.result);setDone(tb);}
        } else if(ev.type==='text'){
          if(!ansEl) ansEl=addAns(grp);
          insertBeforeCur(ansEl,ev.text);
        } else if(ev.type==='done'){
          clearCursors(grp);
        }
        bot();
      }
    }
    clearCursors(grp);

  }catch{
    await mockAgent(query,grp);
  }
  addActions(grp);
}

// ═══════════════════════════════════════════════════════
//  MOCK AGENT — when backend offline
// ═══════════════════════════════════════════════════════
const MOCK={
  check_inventory:{
    think:`Analyzing query → relevant tool: check_inventory\n\nWill call Amazon SP-API to fetch current stock levels for all products, compare against reorder points, and flag any critical or warning-level items.`,
    lines:[
      ['→ Connecting to Amazon SP-API...','b'],
      ['→ Fetching all product inventory...','b'],['','d'],
      ['[SCAN] B08N5WRWNW  Phone Case iPhone 15','d'],
      ['  Stock: 8 units | Reorder point: 20','d'],
      ['  ⚠️ WARNING — ~2 days remaining','a'],
      ['  📱 WhatsApp alert dispatched','p'],['','d'],
      ['[SCAN] B09B8YWXYZ  USB-C Cable 3m','d'],
      ['  Stock: 145 units ✅ Healthy','g'],['','d'],
      ['[SCAN] B07XQXZABC  Wireless Earbuds ANC','d'],

async function mockAgent(query,grp){
  const q=query.toLowerCase();
  const key=(
    q.match(/stock|inventory|maal|unit|reorder/)?'check_inventory':
    q.match(/ad|acos|campaign|pause|waste|spend/)?'optimize_ads':
    q.match(/review|reply|star|complaint|negative/)?'monitor_reviews':
    q.match(/listing|suppress|buy.?box|listing/)?'check_listings':
    'store_health_report'
  );
  const m=MOCK[key];

  // thinking
  const tb=addThink(grp,'');
  await typeInto(tb.querySelector('.think-body'),m.think,14);
  await wait(300);

  // tool
  const tool=addTool(grp,key,{});
  await wait(400);
  for(const [txt,cls] of m.lines){
    await wait(100);
    const s=document.createElement('span');
    s.className='tl '+(cls||'');
    s.textContent=txt;
    tool.querySelector('.tbk-body').appendChild(s);
    bot();
  }
  setDone(tool);
  await wait(300);

  // answer — type it
  const ans=addAns(grp);
  await typeInto(ans, m.ans, 11);
  clearCursors(grp);
  addActions(grp);
}

//  UI HELPERS
// ═══════════════════════════════════════════════════════
function makeAgentGroup(){
  const g=mk('div','mg');
  const w=mk('div','who');
  w.innerHTML=`<span class="who-em">🤖</span><span style="color:var(--t2)">SellerPilot Agent</span>`;
  g.appendChild(w);
  chatEl.appendChild(g);
  bot(); return g;
}
function addThink(grp,txt){
  const d=mk('div','think');
  d.innerHTML=`<div class="think-hd">Thinking</div><div class="think-body" style="white-space:pre-wrap">${esc(txt)}<span class="cur"></span></div>`;
  insBefore(grp,d); bot(); return d;
}
function addTool(grp,name,inp){
  const args=Object.keys(inp||{}).length?`(${Object.entries(inp).map(([k,v])=>`${k}=${v}`).join(', ')})`:' ()';
  const d=mk('div','tbk');
  d.innerHTML=`
    <div class="tbk-hd">
      <span style="color:var(--t3);font-size:10px">fn</span>
      <span class="tbk-fn">${name}</span>
      <span class="tbk-args">${args}</span>
      <span class="tbk-st run" data-st>● running</span>
    </div>
    <div class="tbk-body" data-out></div>`;
  insBefore(grp,d); bot(); return d;
}
function fillToolResult(tbk,result){
  const out=tbk.querySelector('[data-out]');
  result.split('\n').slice(0,24).forEach(l=>{
    const s=document.createElement('span');
    s.className='tl '+(
      /✅|OK|healthy|Healthy|saved|complete/i.test(l)?'g':
      /🚨|CRITICAL|SUPPRESSED|URGENT|IMMEDIATE/i.test(l)?'r':
      /⚠️|WARNING|high|HIGH|ACOS|Pausing|⏸️/i.test(l)?'a':
      /→|INFO|Fetch|Connect|Scan/i.test(l)?'b':
      /📱|alert|Alert/i.test(l)?'p':
      /💰|savings|₹/i.test(l)?'t':
      /^─|^═|^$/.test(l)?'d':''
    );
    s.textContent=l;
    out.appendChild(s);
  });
}
function setDone(tbk){
  const st=tbk.querySelector('[data-st]');
  if(st){st.textContent='✓ done';st.className='tbk-st ok';}
}
function addAns(grp){
  const d=mk('div','atxt');
  d.innerHTML='<span class="cur"></span>';
  insBefore(grp,d); return d;
}
function insertBeforeCur(el,text){
  const cur=el.querySelector('.cur');
  // Render bold **text**
  const parts=text.split(/(\*\*[^*]+\*\*)/g);
  parts.forEach(p=>{
    if(p.startsWith('**')&&p.endsWith('**')){
      const b=document.createElement('strong');
      b.textContent=p.slice(2,-2);
      if(cur) el.insertBefore(b,cur); else el.appendChild(b);
    } else {
      const lines=p.split('\n');
      lines.forEach((ln,i)=>{
        const tn=document.createTextNode(ln);
        if(cur) el.insertBefore(tn,cur); else el.appendChild(tn);
        if(i<lines.length-1){
          const br=document.createElement('br');
          if(cur) el.insertBefore(br,cur); else el.appendChild(br);
        }
      });
    }
  });
}
function addActions(grp){
  const d=mk('div','macts');
  d.innerHTML=`
    <button class="mact">👍 Good</button>
    <button class="mact">👎 Bad</button>
    <button class="mact" onclick="copyGrp(this)">📋 Copy</button>
    <button class="mact" onclick="rerunGrp(this)">↺ Retry</button>`;
  grp.appendChild(d);
}
function clearCursors(grp){grp.querySelectorAll('.cur').forEach(c=>c.remove());}
function insBefore(grp,el){
  const acts=grp.querySelector('.macts');
  if(acts) grp.insertBefore(el,acts); else grp.appendChild(el);
}
function copyGrp(btn){
  const grp=btn.closest('.mg');
  const at=grp.querySelector('.atxt');
  if(at) navigator.clipboard.writeText(at.textContent).then(()=>{btn.textContent='✓ Copied';setTimeout(()=>btn.textContent='📋 Copy',1500);});
}
function rerunGrp(btn){
  const grp=btn.closest('.mg');
  const prev=grp.previousElementSibling;
  if(prev){const ub=prev.querySelector('.ubub');if(ub)q(ub.textContent);}
}
function bot(){ chatEl.scrollTop=chatEl.scrollHeight; }
function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }
function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function mk(tag,cls){ const e=document.createElement(tag); e.className=cls; return e; }
async function typeInto(el,text,ms=12){
  const cur=el.querySelector?.('.cur');
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(c==='\n'){
      const br=document.createElement('br');
      if(cur) el.insertBefore(br,cur); else el.appendChild(br);
    } else {
      const tn=document.createTextNode(c);
      if(cur) el.insertBefore(tn,cur); else el.appendChild(tn);
    }
    if(i%4===0) bot();
    await wait(ms);
  }
}
