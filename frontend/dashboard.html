<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SellerPilot AI — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #0a0a0f;
    --bg2: #111118;
    --bg3: #1a1a24;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --text: #e8e8f0;
    --text2: #8888aa;
    --text3: #5555770;
    --accent: #7c6cfc;
    --accent2: #9d8fff;
    --green: #22c97a;
    --red: #f05a5a;
    --amber: #f0a832;
    --blue: #4da6ff;
    --radius: 12px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    font-size: 14px;
  }

  /* Layout */
  .layout { display: flex; height: 100vh; overflow: hidden; }
  .sidebar {
    width: 220px; min-width: 220px;
    background: var(--bg2);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    padding: 0;
  }
  .main { flex: 1; overflow-y: auto; padding: 28px; }

  /* Sidebar */
  .logo {
    padding: 20px 20px 16px;
    border-bottom: 1px solid var(--border);
  }
  .logo-title { font-size: 15px; font-weight: 700; color: var(--text); letter-spacing: -0.3px; }
  .logo-sub { font-size: 11px; color: var(--accent2); margin-top: 2px; font-family: 'JetBrains Mono', monospace; }
  .logo-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--green); display: inline-block;
    margin-right: 6px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .nav { padding: 12px 10px; flex: 1; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px; border-radius: var(--radius-sm);
    cursor: pointer; transition: all 0.15s;
    color: var(--text2); font-size: 13px; font-weight: 500;
    margin-bottom: 2px;
  }
  .nav-item:hover { background: var(--bg3); color: var(--text); }
  .nav-item.active { background: rgba(124,108,252,0.15); color: var(--accent2); }
  .nav-icon { width: 16px; text-align: center; font-size: 15px; }
  .nav-badge {
    margin-left: auto;
    background: var(--red);
    color: white; font-size: 10px; font-weight: 700;
    padding: 2px 6px; border-radius: 20px; min-width: 18px; text-align: center;
  }

  /* Top bar */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 24px;
  }
  .topbar-title { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
  .topbar-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .btn {
    padding: 8px 16px; border-radius: var(--radius-sm);
    border: none; cursor: pointer; font-family: inherit;
    font-size: 13px; font-weight: 600; transition: all 0.15s;
  }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { background: var(--accent2); transform: translateY(-1px); }
  .btn-outline {
    background: transparent; color: var(--text2);
    border: 1px solid var(--border2);
  }
  .btn-outline:hover { background: var(--bg3); color: var(--text); }
  .btn-sm { padding: 5px 10px; font-size: 12px; }

  /* KPI Cards */
  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px; }
  .kpi {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px;
    position: relative; overflow: hidden;
    transition: border-color 0.2s;
  }
  .kpi:hover { border-color: var(--border2); }
  .kpi-label { font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.8px; font-weight: 600; }
  .kpi-value { font-size: 26px; font-weight: 700; margin: 6px 0 4px; letter-spacing: -1px; }
  .kpi-change { font-size: 11px; font-family: 'JetBrains Mono', monospace; }
  .kpi-icon { position: absolute; right: 16px; top: 16px; font-size: 22px; opacity: 0.5; }
  .kpi.alert-card { border-color: rgba(240,90,90,0.3); }
  .kpi.alert-card .kpi-value { color: var(--red); }
  .kpi.good-card { border-color: rgba(34,201,122,0.3); }
  .kpi.good-card .kpi-value { color: var(--green); }
  .kpi.warn-card { border-color: rgba(240,168,50,0.3); }
  .kpi.warn-card .kpi-value { color: var(--amber); }

  /* Grid 2 cols */
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }

  /* Cards */
  .card {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
  }
  .card-header {
    padding: 14px 18px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .card-title { font-size: 13px; font-weight: 600; }
  .card-body { padding: 0; }

  /* Table */
  table { width: 100%; border-collapse: collapse; }
  th {
    font-size: 11px; color: var(--text2); text-transform: uppercase;
    letter-spacing: 0.6px; padding: 10px 18px; text-align: left;
    font-weight: 600; background: var(--bg3);
    border-bottom: 1px solid var(--border);
  }
  td { padding: 11px 18px; border-bottom: 1px solid var(--border); font-size: 13px; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,0.02); }

  /* Badges */
  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 8px; border-radius: 20px;
    font-size: 11px; font-weight: 600; font-family: 'JetBrains Mono', monospace;
  }
  .badge-red { background: rgba(240,90,90,0.15); color: var(--red); }
  .badge-green { background: rgba(34,201,122,0.15); color: var(--green); }
  .badge-amber { background: rgba(240,168,50,0.15); color: var(--amber); }
  .badge-blue { background: rgba(77,166,255,0.15); color: var(--blue); }
  .badge-purple { background: rgba(124,108,252,0.15); color: var(--accent2); }

  /* Agent terminal */
  .terminal {
    background: #0d0d15;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 16px;
  }
  .terminal-header {
    background: var(--bg3); padding: 10px 16px;
    display: flex; align-items: center; gap: 8px;
    border-bottom: 1px solid var(--border);
  }
  .term-dot { width: 10px; height: 10px; border-radius: 50%; }
  .term-title { font-size: 12px; color: var(--text2); margin-left: 4px; font-family: 'JetBrains Mono', monospace; }
  .terminal-body {
    padding: 16px; min-height: 160px; max-height: 280px; overflow-y: auto;
    font-family: 'JetBrains Mono', monospace; font-size: 12px; line-height: 1.7;
  }
  .log-line { margin: 2px 0; }
  .log-info { color: var(--blue); }
  .log-success { color: var(--green); }
  .log-warn { color: var(--amber); }
  .log-error { color: var(--red); }
  .log-agent { color: var(--accent2); }
  .log-muted { color: var(--text2); }

  /* Input row */
  .agent-input-row {
    display: flex; gap: 8px; padding: 12px;
    border-top: 1px solid var(--border);
    background: var(--bg2);
  }
  .agent-input {
    flex: 1; background: var(--bg3);
    border: 1px solid var(--border2); border-radius: var(--radius-sm);
    color: var(--text); font-family: 'JetBrains Mono', monospace;
    font-size: 12px; padding: 8px 12px; outline: none;
    transition: border-color 0.2s;
  }
  .agent-input:focus { border-color: var(--accent); }

  /* Alerts list */
  .alert-item {
    padding: 12px 18px; border-bottom: 1px solid var(--border);
    display: flex; align-items: flex-start; gap: 12px;
  }
  .alert-item:last-child { border-bottom: none; }
  .alert-dot {
    width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex-shrink: 0;
  }
  .alert-msg { font-size: 13px; line-height: 1.5; }
  .alert-time { font-size: 11px; color: var(--text2); margin-top: 2px; font-family: 'JetBrains Mono', monospace; }

  /* ACOS bar */
  .acos-bar-wrap { background: var(--bg3); border-radius: 4px; height: 5px; flex: 1; overflow: hidden; }
  .acos-bar { height: 100%; border-radius: 4px; transition: width 0.6s ease; }

  /* Spinner */
  .spinner {
    display: inline-block; width: 12px; height: 12px;
    border: 2px solid rgba(124,108,252,0.3);
    border-top-color: var(--accent2);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Responsive fix */
  @media (max-width: 900px) {
    .kpi-grid { grid-template-columns: repeat(2,1fr); }
    .grid2 { grid-template-columns: 1fr; }
    .sidebar { display: none; }
  }
</style>
</head>
<body>
<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-title">
        <span class="logo-dot"></span>SellerPilot AI
      </div>
      <div class="logo-sub">v1.0 · agent active</div>
    </div>
    <nav class="nav">
      <div class="nav-item active" onclick="showTab('dashboard')">
        <span class="nav-icon">📊</span> Dashboard
      </div>
      <div class="nav-item" onclick="showTab('agent')">
        <span class="nav-icon">🤖</span> AI Agent
      </div>
      <div class="nav-item" onclick="showTab('inventory')">
        <span class="nav-icon">📦</span> Inventory
        <span class="nav-badge" id="inv-badge">2</span>
      </div>
      <div class="nav-item" onclick="showTab('reviews')">
        <span class="nav-icon">⭐</span> Reviews
        <span class="nav-badge" id="rev-badge">2</span>
      </div>
      <div class="nav-item" onclick="showTab('ads')">
        <span class="nav-icon">📢</span> Ads
        <span class="nav-badge" id="ads-badge">2</span>
      </div>
      <div class="nav-item" onclick="showTab('alerts')">
        <span class="nav-icon">🔔</span> Alerts
        <span class="nav-badge" id="alert-badge">3</span>
      </div>
    </nav>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main" id="main-content">
    <!-- Content injected by JS -->
  </main>

</div>

<script>
// ============================================================
// DATA (mirrors backend mock data)
// ============================================================
const DATA = {
  products: [
    { asin:"B08N5WRWNW", title:"Premium Phone Case iPhone 15", stock:8, reorder:20, price:599, buybox:82.5, status:"active" },
    { asin:"B09B8YWXYZ", title:"Fast Charging Cable USB-C 3m", stock:145, reorder:30, price:299, buybox:95.0, status:"active" },
    { asin:"B07XQXZABC", title:"Wireless Earbuds Noise Cancelling", stock:3, reorder:15, price:1299, buybox:0, status:"suppressed" },
    { asin:"B08KQPQDEF", title:"Waterproof Laptop Backpack 15.6in", stock:67, reorder:25, price:1599, buybox:78.0, status:"active" },
  ],
  reviews: [
    { id:"REV001", asin:"B08N5WRWNW", rating:2, reviewer:"Rahul S.", title:"Cheap quality, broke in 1 week", body:"The case cracked after just one week of use. Very disappointed.", replied:false },
    { id:"REV002", asin:"B09B8YWXYZ", rating:1, reviewer:"Priya M.", title:"Stopped charging after 3 days", body:"Bought this cable and it stopped working within 3 days. Complete waste.", replied:false },
    { id:"REV003", asin:"B08KQPQDEF", rating:5, reviewer:"Amit K.", title:"Excellent bag!", body:"Great quality bag. Very spacious and waterproof.", replied:true },
  ],
  campaigns: [
    { id:"CAMP001", name:"Phone Case – Broad Match", acos:68.5, spend:2850, revenue:4160, clicks:312, status:"active" },
    { id:"CAMP002", name:"Charger – Exact Match",     acos:18.2, spend:890,  revenue:4890, clicks:178, status:"active" },
    { id:"CAMP003", name:"Earbuds – Auto Campaign",   acos:145,  spend:1200, revenue:827,  clicks:89,  status:"active" },
    { id:"CAMP004", name:"Laptop Bag – Sponsored",    acos:22.5, spend:1580, revenue:7022, clicks:245, status:"active" },
  ]
};

let logs = [];
let currentTab = "dashboard";

// ============================================================
// LOG HELPER
// ============================================================
function log(msg, type="info") {
  const now = new Date().toLocaleTimeString();
  logs.push({ msg, type, time:now });
  if (logs.length > 60) logs.shift();
  const el = document.getElementById("terminal-logs");
  if (el) {
    el.innerHTML = logs.map(l =>
      `<div class="log-line log-${l.type}">[${l.time}] ${l.msg}</div>`
    ).join("");
    el.scrollTop = el.scrollHeight;
  }
}

// ============================================================
// TABS
// ============================================================
function showTab(tab) {
  currentTab = tab;
  document.querySelectorAll(".nav-item").forEach(el => el.classList.remove("active"));
  const tabs = ["dashboard","agent","inventory","reviews","ads","alerts"];
  const idx = tabs.indexOf(tab);
  document.querySelectorAll(".nav-item")[idx]?.classList.add("active");
  render();
}

// ============================================================
// RENDER
// ============================================================
function render() {
  const el = document.getElementById("main-content");
  if (currentTab === "dashboard")  el.innerHTML = renderDashboard();
  if (currentTab === "agent")      el.innerHTML = renderAgent();
  if (currentTab === "inventory")  el.innerHTML = renderInventory();
  if (currentTab === "reviews")    el.innerHTML = renderReviews();
  if (currentTab === "ads")        el.innerHTML = renderAds();
  if (currentTab === "alerts")     el.innerHTML = renderAlerts();
  attachEvents();
}

// ============================================================
// DASHBOARD
// ============================================================
function renderDashboard() {
  const totalRev = DATA.campaigns.reduce((s,c)=>s+c.revenue,0);
  const totalSpend = DATA.campaigns.reduce((s,c)=>s+c.spend,0);
  const acos = (totalSpend/totalRev*100).toFixed(1);
  const lowStock = DATA.products.filter(p=>p.stock<=p.reorder).length;
  const suppressed = DATA.products.filter(p=>p.status==="suppressed").length;
  const negReviews = DATA.reviews.filter(r=>r.rating<=2&&!r.replied).length;
  const highAcos = DATA.campaigns.filter(c=>c.acos>40).length;

  return `
  <div class="topbar">
    <div>
      <div class="topbar-title">Dashboard</div>
      <div class="topbar-sub">Last updated: ${new Date().toLocaleTimeString()} · Auto-refresh every 60s</div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-outline" onclick="showTab('agent')">🤖 Ask Agent</button>
      <button class="btn btn-primary" onclick="runFullCheck()">⚡ Run Full Check</button>
    </div>
  </div>

  <div class="kpi-grid">
    <div class="kpi good-card">
      <div class="kpi-label">Today's Revenue</div>
      <div class="kpi-value">₹${(totalRev/1000).toFixed(1)}K</div>
      <div class="kpi-change" style="color:var(--green)">▲ 12% vs yesterday</div>
      <div class="kpi-icon">💰</div>
    </div>
    <div class="kpi warn-card">
      <div class="kpi-label">Overall ACOS</div>
      <div class="kpi-value">${acos}%</div>
      <div class="kpi-change" style="color:var(--amber)">Target: &lt;30%</div>
      <div class="kpi-icon">📢</div>
    </div>
    <div class="kpi alert-card">
      <div class="kpi-label">Active Alerts</div>
      <div class="kpi-value">${lowStock+suppressed+negReviews+highAcos}</div>
      <div class="kpi-change" style="color:var(--red)">Needs attention</div>
      <div class="kpi-icon">🚨</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Ad Spend Today</div>
      <div class="kpi-value">₹${(totalSpend/1000).toFixed(1)}K</div>
      <div class="kpi-change" style="color:var(--text2)">${DATA.campaigns.length} campaigns</div>
      <div class="kpi-icon">📊</div>
    </div>
  </div>

  <div class="grid2">
    <div class="card">
      <div class="card-header">
        <span class="card-title">⚠️ Action Required</span>
        <span class="badge badge-red">${lowStock+suppressed+negReviews+highAcos} items</span>
      </div>
      <div class="card-body">
        ${lowStock>0?`<div class="alert-item"><div class="alert-dot" style="background:var(--red)"></div><div><div class="alert-msg">📦 <strong>${lowStock} products</strong> below reorder point</div><div class="alert-time">Requires restock order</div></div></div>`:""}
        ${suppressed>0?`<div class="alert-item"><div class="alert-dot" style="background:var(--red)"></div><div><div class="alert-msg">❌ <strong>${suppressed} listing(s)</strong> suppressed by Amazon</div><div class="alert-time">Revenue loss in progress</div></div></div>`:""}
        ${negReviews>0?`<div class="alert-item"><div class="alert-dot" style="background:var(--amber)"></div><div><div class="alert-msg">⭐ <strong>${negReviews} negative reviews</strong> unanswered</div><div class="alert-time">AI replies drafted — approve to post</div></div></div>`:""}
        ${highAcos>0?`<div class="alert-item"><div class="alert-dot" style="background:var(--amber)"></div><div><div class="alert-msg">💸 <strong>${highAcos} campaigns</strong> with ACOS &gt;40%</div><div class="alert-time">₹${DATA.campaigns.filter(c=>c.acos>40).reduce((s,c)=>s+c.spend,0).toLocaleString('en-IN')} daily wastage</div></div></div>`:""}
      </div>
    </div>
    <div class="card">
      <div class="card-header">
        <span class="card-title">📦 Inventory Snapshot</span>
        <button class="btn btn-outline btn-sm" onclick="showTab('inventory')">View All</button>
      </div>
      <div class="card-body">
        ${DATA.products.map(p=>`
        <div class="alert-item">
          <div class="alert-dot" style="background:${p.stock<=p.reorder?'var(--red)':p.status==='suppressed'?'var(--red)':'var(--green)'}"></div>
          <div style="flex:1">
            <div class="alert-msg">${p.title.substring(0,36)}…</div>
            <div style="display:flex;gap:8px;margin-top:4px;align-items:center">
              <span class="badge ${p.stock<=5?'badge-red':p.stock<=p.reorder?'badge-amber':'badge-green'}">${p.stock} units</span>
              ${p.status==='suppressed'?'<span class="badge badge-red">SUPPRESSED</span>':''}
            </div>
          </div>
        </div>`).join("")}
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <span class="card-title">📢 Ad Performance Today</span>
      <button class="btn btn-outline btn-sm" onclick="runAdsOptimize()">⚡ Optimize Now</button>
    </div>
    <div class="card-body">
      <table>
        <thead><tr><th>Campaign</th><th>ACOS</th><th>Spend</th><th>Revenue</th><th>Status</th></tr></thead>
        <tbody>
          ${DATA.campaigns.map(c=>`<tr>
            <td>${c.name}</td>
            <td>
              <div style="display:flex;align-items:center;gap:8px">
                <span class="badge ${c.acos>40?'badge-red':c.acos>25?'badge-amber':'badge-green'}">${c.acos}%</span>
                <div class="acos-bar-wrap"><div class="acos-bar" style="width:${Math.min(100,c.acos)}%;background:${c.acos>40?'var(--red)':c.acos>25?'var(--amber)':'var(--green)'}"></div></div>
              </div>
            </td>
            <td style="font-family:'JetBrains Mono',monospace">₹${c.spend.toLocaleString('en-IN')}</td>
            <td style="font-family:'JetBrains Mono',monospace">₹${c.revenue.toLocaleString('en-IN')}</td>
            <td><span class="badge ${c.status==='active'?'badge-green':'badge-red'}">${c.status}</span></td>
          </tr>`).join("")}
        </tbody>
      </table>
    </div>
  </div>`;
}

// ============================================================
// AGENT TAB
// ============================================================
function renderAgent() {
  return `
  <div class="topbar">
    <div>
      <div class="topbar-title">🤖 AI Agent</div>
      <div class="topbar-sub">ReAct Agent · GPT-4o-mini · LangChain</div>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px">
    <button class="btn btn-outline" style="padding:12px;text-align:left" onclick="runAgentTask('Check inventory and alert for low stock products')">
      📦 <strong>Check Inventory</strong><br><small style="color:var(--text2)">Scan stock levels</small>
    </button>
    <button class="btn btn-outline" style="padding:12px;text-align:left" onclick="runAgentTask('Find negative reviews and draft professional replies')">
      ⭐ <strong>Handle Reviews</strong><br><small style="color:var(--text2)">Draft AI replies</small>
    </button>
    <button class="btn btn-outline" style="padding:12px;text-align:left" onclick="runAgentTask('Optimize ad campaigns - pause high ACOS ones')">
      📢 <strong>Optimize Ads</strong><br><small style="color:var(--text2)">Pause wasteful ads</small>
    </button>
    <button class="btn btn-outline" style="padding:12px;text-align:left" onclick="runAgentTask('Check all listings for suppressed or unhealthy status')">
      🔍 <strong>Check Listings</strong><br><small style="color:var(--text2)">Find issues</small>
    </button>
    <button class="btn btn-outline" style="padding:12px;text-align:left" onclick="runAgentTask('Generate complete store health report')">
      📊 <strong>Health Report</strong><br><small style="color:var(--text2)">Full store audit</small>
    </button>
    <button class="btn btn-primary" style="padding:12px;text-align:left" onclick="runFullCheck()">
      ⚡ <strong>Run All Tasks</strong><br><small style="opacity:0.8">Complete morning routine</small>
    </button>
  </div>

  <div class="terminal">
    <div class="terminal-header">
      <div class="term-dot" style="background:#f05a5a"></div>
      <div class="term-dot" style="background:#f0a832"></div>
      <div class="term-dot" style="background:#22c97a"></div>
      <span class="term-title">agent.log — SellerPilot AI Terminal</span>
    </div>
    <div class="terminal-body" id="terminal-logs">
      <div class="log-line log-muted">[--:--:--] SellerPilot AI Agent ready. Waiting for task...</div>
      <div class="log-line log-muted">[--:--:--] Type a command below or click a quick action above.</div>
    </div>
    <div class="agent-input-row">
      <input class="agent-input" id="agent-input" type="text"

        onkeydown="if(event.key==='Enter')sendAgentMsg()"/>
      <button class="btn btn-primary btn-sm" onclick="sendAgentMsg()">Send ↗</button>
    </div>
  </div>`;
}

function renderReviews() {

function renderAds() {
  return `

function renderCampaignRows() {
  return DATA.campaigns.map(c=>`<tr id="row-${c.id}">
    <td>${c.name}</td>
    <td>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="badge ${c.acos>40?'badge-red':c.acos>25?'badge-amber':'badge-green'}">${c.acos}%</span>
        <div class="acos-bar-wrap"><div class="acos-bar" style="width:${Math.min(100,c.acos)}%;background:${c.acos>40?'var(--red)':c.acos>25?'var(--amber)':'var(--green)'}"></div></div>

    </td>
    <td style="font-family:'JetBrains Mono',monospace">₹${c.spend.toLocaleString('en-IN')}</td>
    <td style="font-family:'JetBrains Mono',monospace">₹${c.revenue.toLocaleString('en-IN')}</td>
    <td>${c.clicks}</td>
    <td><span class="badge ${c.status==='active'?'badge-green':'badge-red'}">${c.status}</span></td>
    <td>
      ${c.status==='active'&&c.acos>40
        ?`<button class="btn btn-outline btn-sm" onclick="pauseCampaign('${c.id}')">⏸ Pause</button>`

// ALERTS TAB
// ============================================================
function renderAlerts() {

    { type:"low_stock",         severity:"critical", icon:"🚨", msg:"Phone Case: Only 8 units (reorder point 20). Estimated 2 days remaining.", time:"2 min ago" },

// ============================================================
// AGENT ACTIONS
// ============================================================
async function runAgentTask(task) {
  showTab("agent");
  setTimeout(()=>executeAgent(task), 100);
}

async function executeAgent(task) {
  log(`User: ${task}`, "info");
  log(`🤖 Agent thinking...`, "agent");

  const steps = getAgentSteps(task);
  for (let i=0; i<steps.length; i++) {
    await delay(600+i*400);
    log(steps[i].msg, steps[i].type);
  }
}

function getAgentSteps(task) {
  const t = task.toLowerCase();
  if (t.includes("inventory") || t.includes("stock")) return [
    {msg:"→ Action: check_inventory_and_alert(threshold_multiplier=1.0)", type:"agent"},
    {msg:"→ Fetching inventory from Amazon SP-API...", type:"info"},
    {msg:"⚠️  WARN: B08N5WRWNW — Stock: 8 units (reorder: 20) — 2 days left", type:"warn"},
    {msg:"🚨 CRIT: B07XQXZABC — Stock: 3 units (reorder: 15) — LISTING SUPPRESSED", type:"error"},
    {msg:"✅ OK:   B09B8YWXYZ — Stock: 145 units (healthy)", type:"success"},
    {msg:"✅ OK:   B08KQPQDEF — Stock: 67 units (healthy)", type:"success"},
    {msg:"📱 WhatsApp alert sent to seller for 2 products", type:"info"},
    {msg:"✅ Inventory check complete. 2 products need restock.", type:"success"},
  ];
  if (t.includes("review")) return [
    {msg:"→ Action: monitor_reviews_and_draft_replies()", type:"agent"},
    {msg:"→ Fetching reviews from last 7 days...", type:"info"},
    {msg:"⭐ Found: REV001 — Rahul S. — 2/5 — 'Cheap quality, broke in 1 week'", type:"warn"},
    {msg:"⭐ Found: REV002 — Priya M. — 1/5 — 'Stopped charging after 3 days'", type:"error"},
    {msg:"✍️  Drafting professional reply for REV001...", type:"info"},
    {msg:"✍️  Drafting professional reply for REV002...", type:"info"},
    {msg:"📱 Alert sent: 2 negative reviews need attention", type:"info"},
    {msg:"✅ Replies drafted. Please review and approve in Reviews tab.", type:"success"},
  ];
  if (t.includes("ad") || t.includes("acos") || t.includes("optim")) return [
    {msg:"→ Action: optimize_ad_campaigns(acos_threshold=40.0)", type:"agent"},
    {msg:"→ Fetching all campaign performance data...", type:"info"},
    {msg:"✅ CAMP002 — Charger Exact — ACOS 18.2% — Good performance", type:"success"},
    {msg:"✅ CAMP004 — Laptop Bag   — ACOS 22.5% — Good performance", type:"success"},
    {msg:"⚠️  CAMP001 — Phone Case  — ACOS 68.5% — ABOVE threshold! Pausing...", type:"warn"},
    {msg:"🚨 CAMP003 — Earbuds Auto — ACOS 145%  — CRITICAL! Pausing immediately...", type:"error"},
    {msg:"⏸️  Paused: Phone Case – Broad Match (saved ₹2,850/day)", type:"warn"},
    {msg:"⏸️  Paused: Earbuds – Auto Campaign (saved ₹1,200/day)", type:"warn"},
    {msg:"💰 Total daily savings: ₹4,050", type:"success"},
    {msg:"📱 Alert sent to seller with pause summary", type:"info"},
    {msg:"✅ Ad optimization complete. 2 campaigns paused.", type:"success"},
  ];
  return [
    {msg:"→ Action: generate_store_health_report()", type:"agent"},
    {msg:"→ Fetching all store data...", type:"info"},
    {msg:"📦 Inventory: 2 low stock · 1 suppressed", type:"warn"},
    {msg:"⭐ Reviews: 2 negative unread", type:"warn"},
    {msg:"📢 Ads: 2 high ACOS campaigns (₹4,050/day wasted)", type:"error"},
    {msg:"🏥 Account Health: At Risk (late shipment 3.2%)", type:"warn"},
    {msg:"✅ Report generated. Check Alerts tab for full list.", type:"success"},
  ];
}

async function runFullCheck() {
  showTab("agent");
  setTimeout(async ()=>{
    log("⚡ Starting full store check...", "info");
    await delay(300);
    const tasks = [
      "inventory check", "review check", "ad optimization", "listing check", "health report"
    ];
    for (const t of tasks) {
      const steps = getAgentSteps(t);
      log(`\n── Running: ${t.toUpperCase()} ──`, "muted");
      for (let i=0; i<steps.length; i++) {
        await delay(300);
        log(steps[i].msg, steps[i].type);
      }
    }
    log("🎉 Full check complete! All tasks done.", "success");
  }, 100);
}

async function runAdsOptimize() {
  await executeAgent("Optimize ad campaigns - pause high ACOS ones");
  // Update campaign statuses in data
  DATA.campaigns.forEach(c => { if(c.acos>40) c.status = "paused"; });
  if(currentTab==="ads") {
    const tb = document.getElementById("campaigns-tbody");
    if(tb) tb.innerHTML = renderCampaignRows();
  }
}

function pauseCampaign(id) {
  const c = DATA.campaigns.find(x=>x.id===id);
  if(c) { c.status="paused"; render(); }
}

function resumeCampaign(id) {
  const c = DATA.campaigns.find(x=>x.id===id);
  if(c) { c.status="active"; render(); }
}

function approveReply(id) {
  const r = DATA.reviews.find(x=>x.id===id);
  if(r) { r.replied=true; render(); log(`✅ Reply approved and posted for review ${id}`, "success"); }
}

function sendAgentMsg() {
  const inp = document.getElementById("agent-input");
  if(!inp||!inp.value.trim()) return;
  const task = inp.value.trim();
  inp.value = "";
  executeAgent(task);
}

function attachEvents() {}
function delay(ms) { return new Promise(r=>setTimeout(r,ms)); }

// ── INIT ──
log("SellerPilot AI initialized", "success");
log("Mock data loaded (4 products, 3 reviews, 4 campaigns)", "info");
render();
</script>
